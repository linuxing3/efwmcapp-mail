name: Enable Cloudflare Email Routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Email Routing DNS for efwmcapp.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_id=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$api/zones?name=efwmcapp.com&status=active" | jq -er '.result[0].id')
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
            "$api/zones/$zone_id/email/routing/enable" --data '{}' \
            | jq -e '{success, result: {enabled, name, status}}'
