name: Restore landing page apex domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Attach efwmcapp.com to the landing-page Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_id=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "$api/zones?name=efwmcapp.com&status=active" | jq -er '.result[0].id')
          payload=$(jq -n --arg zone_id "$zone_id" '{
            hostname: "efwmcapp.com",
            service: "efwmcapp-lp",
            zone_id: $zone_id
          }')
          curl --fail-with-body --silent --show-error -X PUT "${auth[@]}" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            --data "$payload" | jq -e '{success, result: {hostname, service, zone_name}}'
