name: Reset Cloud Mail administrator password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mail-worker/pnpm-lock.yaml
      - name: Install Wrangler
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile
      - name: Reset the administrator password
        working-directory: mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESET_PASSWORD: ${{ secrets.CLOUD_MAIL_ADMIN_RESET_PASSWORD }}
          ADMIN_EMAIL: overlabor77@efwmcapp.com
          DATABASE: efwmcapp-mail
        run: |
          set -euo pipefail
          test -n "$RESET_PASSWORD"
          salt=$(node -e "console.log(require('crypto').randomBytes(16).toString('base64'))")
          hash=$(node -e "console.log(require('crypto').createHash('sha256').update(process.argv[1] + process.argv[2]).digest('base64'))" "$salt" "$RESET_PASSWORD")
          sql="UPDATE user SET salt = '$salt', password = '$hash' WHERE email = '$ADMIN_EMAIL';"
          result=$(pnpm wrangler d1 execute "$DATABASE" --remote --json --command "$sql")
          printf '%s' "$result" | jq -e '.[0].meta.changes == 1' >/dev/null || {
            echo 'Administrator account was not found or was not updated.' >&2
            exit 1
          }
          echo 'Administrator password reset completed.'
